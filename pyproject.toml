[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nebulus"
version = "0.1.0"
description = "Nebulus Prime - Linux-only AI System"
readme = "README.md"
authors = [{name = "User", email = "labs@example.com"}]
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "nebulus-core",
    "numpy",
    "pandas",
    "scikit-learn",
    "click",
    "rich",
    "httpx",
    "pydantic",
    "google-api-python-client",
    "mcp",
    "duckduckgo-search",
    "beautifulsoup4",
    "python-docx",
    "pypdf",
    "apscheduler",
    "chromadb",
    "sqlalchemy",
]

[project.scripts]
nebulus = "src.cli:cli"

[project.entry-points."nebulus.platform"]
prime = "nebulus_prime.adapter:PrimeAdapter"

# --- Black Configuration ---
# --- Setuptools Configuration ---
[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*", "nebulus_prime", "nebulus_prime.*"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | venv
  | _build
  | buck-out
  | build
  | dist
  | models
  | data
)/
'''

# --- Pytest Configuration ---
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
    "src",
    "mcp_server"
]
