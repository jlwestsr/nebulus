services:
  tabby:
    image: ghcr.io/theroyallab/tabbyapi:latest
    container_name: tabby
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ./models:/app/models
      - ./config/tabby:/app/config_mount
    entrypoint:
      - /bin/sh
      - -c
    command: >
      "cp /app/config_mount/config.yml /app/config.yml &&
       cp /app/config_mount/api_tokens.yml /app/api_tokens.yml &&
       python3 main.py"
    networks:
      - ai-network
    ports:
      - "127.0.0.1:5000:5000"  # NPRIME-02: localhost only — no unauthenticated network exposure
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

  dozzle:
    image: amir20/dozzle:latest
    container_name: logs
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8888:8080"  # NPRIME-02: localhost only — log viewer has Docker socket access
    environment:
      - DOZZLE_LEVEL=info
    networks:
      - ai-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
    ports:
      - "127.0.0.1:8001:8000"  # NPRIME-02: localhost only — vector DB has no auth
    networks:
      - ai-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mcp-server:
    build: ./src/mcp_server
    container_name: mcp-server
    restart: unless-stopped
    volumes:
      - .:/workspace # Mount current directory to /workspace for file tools
      - ./src/mcp_server:/app
    ports:
      - "127.0.0.1:8002:8000"  # NPRIME-02: localhost only — MCP API has no auth
    networks:
      - ai-network
    environment:
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"  # NPRIME-02: localhost only — use reverse proxy for LAN access
    volumes:
      - webui_data:/app/backend/data
    environment:
      - OPENAI_API_BASE_URL=http://tabby:5000/v1
      - OPENAI_API_KEY=${TABBY_API_KEY}  # NPRIME-03: real TabbyAPI auth key
    networks:
      - ai-network
    depends_on:
      - tabby
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ai-network:
    driver: bridge

volumes:
  models_data:
  chroma_data:
  webui_data:
